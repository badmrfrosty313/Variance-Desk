[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "variancedesk"
version = "1.0.0"
description = "Offline financial planning and variance analysis desktop application"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-qt>=4.4,<5", "pyinstaller>=6.11,<7"]

[project.scripts]
VarianceDesk = "variancedesk.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
